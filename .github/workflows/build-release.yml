name: Build and Release ClipSync Go daemon

on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: clipsync-daemon-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: clipsync-daemon-linux-arm64

    steps:
      - name: Checking out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Installing dependencies
        run: go mod download

      - name: Building binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o dist/${{ matrix.output_name }} .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bin/clipsync-daemon-linux-amd64/clipsync-daemon-linux-amd64
            bin/clipsync-daemon-linux-arm64/clipsync-daemon-linux-arm64
          draft: false
          prerelease: false
          generate_release_notes: true